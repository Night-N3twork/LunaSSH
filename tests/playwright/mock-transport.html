<!DOCTYPE html>
<html>
<head><meta charset="utf-8" /><title>LunaSSH Mock Transport Test Page</title></head>
<body>
<div id="status">loading</div>
<script type="module">
  import * as Lunassh from '/dist/index.mjs';

  // Minimal MockMoonbeamRelay for browser — no external deps, encodes Wisp packets inline
  function writeU32LE(buf, off, v){ buf[off]=v&0xff; buf[off+1]=(v>>>8)&0xff; buf[off+2]=(v>>>16)&0xff; buf[off+3]=(v>>>24)&0xff; }
  function readU32LE(buf, off){ return (buf[off]|buf[off+1]<<8|buf[off+2]<<16|buf[off+3]<<24)>>>0; }
  function encodePacket(type, streamId, payload){ const out=new Uint8Array(5+payload.length); out[0]=type&0xff; writeU32LE(out,1,streamId); out.set(payload,5); return out; }
  function decodePacket(buf){ if(buf.length<5) return null; return {type:buf[0], streamId:readU32LE(buf,1), payload:buf.subarray(5)}; }
  function encodeConnect(port, host){ const hb=new TextEncoder().encode(host); const out=new Uint8Array(1+2+hb.length); out[0]=0x01; out[1]=port&0xff; out[2]=(port>>>8)&0xff; out.set(hb,3); return out; }
  function encodeClose(reason){ return new Uint8Array([reason&0xff]); }
  function encodeContinue(n){ const out=new Uint8Array(4); writeU32LE(out,0,n); return out; }
  function decodeContinue(p){ if(p.length!==4) return null; return readU32LE(p,0); }
  function decodeConnect(p){ if(p.length<3) return null; const port=p[1]|p[2]<<8; const host=new TextDecoder().decode(p.subarray(3)); return {port, host}; }

  class MockMoonbeamRelay {
    constructor(){ this.attachments=[]; this.closed=false; }
    attach(meta={}){
      if(this.closed) throw new Error('closed');
      const ch=new MessageChannel();
      const clientPort=ch.port2, relayPort=ch.port1;
      this.attachments.push({port:relayPort, remotePort:clientPort, label:meta.label});
      setTimeout(()=>{
        const pkt=encodePacket(0x03,0,encodeContinue(0));
        relayPort.postMessage(pkt.buffer,[pkt.buffer]);
      },0);
      relayPort.onmessage=(ev)=>{
        const buf=ev.data instanceof Uint8Array?ev.data:new Uint8Array(ev.data);
        const pkt=decodePacket(buf);
        if(!pkt) return;
        if(pkt.type===0x01){ // CONNECT
          const c=decodeConnect(pkt.payload);
          if(!c){ const cl=encodePacket(0x04,pkt.streamId,encodeClose(0x41)); relayPort.postMessage(cl.buffer,[cl.buffer]); return; }
          const cont=encodePacket(0x03,pkt.streamId,encodeContinue(256));
          relayPort.postMessage(cont.buffer,[cont.buffer]);
        } else if(pkt.type===0x02){ // DATA
          const echo=encodePacket(0x02,pkt.streamId,pkt.payload);
          relayPort.postMessage(echo.buffer,[echo.buffer]);
          const cont=encodePacket(0x03,pkt.streamId,encodeContinue(256));
          setTimeout(()=>relayPort.postMessage(cont.buffer,[cont.buffer]),1);
        } else if(pkt.type===0x04){
          const cl=encodePacket(0x04,pkt.streamId,encodeClose(pkt.payload[0]??2));
          relayPort.postMessage(cl.buffer,[cl.buffer]);
        }
      };
      try{relayPort.start();}catch{} try{clientPort.start();}catch{}
      return clientPort;
    }
    async close(){ this.closed=true; for(const a of [...this.attachments]){ try{a.port.close()}catch{} try{a.remotePort.close()}catch{} } this.attachments.length=0; }
    get clientCount(){ return this.attachments.length; }
  }

  window.__lunassh = { ...Lunassh, MockMoonbeamRelay };
  // Also expose Lunassh helpers directly
  window.__lunassh_ready = true;
  document.getElementById('status').textContent='ready';
</script>
</body>
</html>
